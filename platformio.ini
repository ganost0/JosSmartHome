[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 9600
build_src_filter = +<*> -<ESP_backup.cpp>
lib_deps =
    blynkkk/Blynk@^1.3.2
    tzapu/WiFiManager@^2.0.17

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 9600
lib_deps =
    blynkkk/Blynk@^1.3.2
    tzapu/WiFiManager@^2.0.17
; Test environment - Unit testing without hardware
[env:test]
platform = native
test_framework = unity
build_src_filter = -<*> +<test_relay_logic.cpp>